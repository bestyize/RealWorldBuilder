<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d14">
  <title>__FISH_NAME__ · 独立预览</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      color-scheme: dark;
      font: 15px/1.5 Inter, system-ui, sans-serif;
      color: #eaf2fa;
      background: #080d14;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    [hidden] { display: none !important; }
    main {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 40%, #172a3b, #0b1420 64%, #070e17);
    }
    canvas, .status { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    .status { display: grid; place-content: center; padding: 16px; text-align: center; }
    header, .transport {
      position: absolute;
      left: max(12px, calc(var(--safe-left) + 8px));
      right: max(12px, calc(var(--safe-right) + 8px));
      display: flex;
    }
    header {
      top: max(12px, calc(var(--safe-top) + 8px));
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    header a, header button { pointer-events: auto; }
    .preview-heading { min-width: 0; }
    h1 { margin: 0 0 6px; font-size: clamp(20px, 2.2vw, 28px); line-height: 1.15; font-weight: 610; }
    header nav { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
    a { padding-block: 6px; color: #afe0fc; text-underline-offset: 4px; }
    html[data-fullscreen] .preview-heading { visibility: hidden; }
    .transport {
      bottom: max(12px, calc(var(--safe-bottom) + 8px));
      max-width: 560px;
      margin-inline: auto;
      align-items: center;
      gap: clamp(8px, 1.5vw, 14px);
      padding: 6px 10px;
      border: 1px solid #334f65;
      border-radius: 12px;
      background: #080d14d9;
      backdrop-filter: blur(12px);
    }
    button {
      min-width: 72px;
      min-height: 40px;
      padding: 7px 12px;
      border: 1px solid #334f65;
      border-radius: 7px;
      background: #172a3a;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: .58; cursor: default; }
    button:not(:disabled):hover { background: #20394d; }
    input { min-width: 0; flex: 1; accent-color: #8cc8ef; cursor: pointer; }
    output { color: #aac0d2; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    :focus-visible { outline: 2px solid #9ed5f8; outline-offset: 4px; }
    .fullscreen-toggle { flex: none; min-height: 44px; background: #14273add; }
    @media (pointer: coarse) {
      button, input[type="range"] { min-height: 44px; }
    }
    @media (orientation: portrait) and (pointer: coarse) {
      main {
        --safe-top: env(safe-area-inset-right, 0px);
        --safe-right: env(safe-area-inset-bottom, 0px);
        --safe-bottom: env(safe-area-inset-left, 0px);
        --safe-left: env(safe-area-inset-top, 0px);
        position: fixed;
        top: 0;
        left: 100vw;
        width: 100vh;
        width: 100dvh;
        height: 100vw;
        transform-origin: top left;
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="stage" id="preview-stage">
      <div class="status" id="preview-status" role="status">正在加载__FISH_NAME__…</div>
    </div>
    <header>
      <div class="preview-heading">
        <h1>__FISH_NAME__</h1>
        <nav aria-label="观赏入口">
          <a href="../../index.html#fish">返回展厅</a>
          <a href="../../aquarium.html">打开水族箱</a>
        </nav>
      </div>
      <button class="fullscreen-toggle" id="preview-fullscreen" type="button" title="全屏（F）" hidden>
        <span data-fullscreen-label>全屏</span>
      </button>
    </header>
    <div class="transport">
      <button id="preview-play" type="button" disabled>暂停</button>
      <input id="preview-time" aria-label="播放进度" type="range" min="0" max="1" value="0" step="any" disabled>
      <output id="preview-time-label" for="preview-time" aria-live="off"></output>
    </div>
  </main>
  __MODEL_DATA__
  <script>__BUNDLE_JS__</script>
</body>
</html>
