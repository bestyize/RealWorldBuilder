<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f0e6">
  <title>碎花垂耳兔 · 3D 预览</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #3c3029;
      background: #f7f0e6;
      --line: rgba(91, 62, 42, .15);
      --muted: #715f52;
      --accent: #914d42;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 26px clamp(16px, 4.4vw, 69px) 20px; }
    main { max-width: 1550px; margin: 0 auto; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 21px; }
    [hidden] { display: none !important; }
    h1 { display: flex; align-items: baseline; column-gap: 17px; row-gap: 2px; flex-wrap: wrap; margin: 0; }
    h1 span { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-size: clamp(34px, 4vw, 52px); font-weight: 650; letter-spacing: .02em; line-height: 1.12; }
    h1 small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .07em; white-space: nowrap; }
    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { opacity: .4; cursor: default; }
    button:focus-visible, canvas:focus-visible, a.action:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .action {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 43px;
      padding: 0 14px; white-space: nowrap; border: 1px solid var(--line); border-radius: 11px;
      background: rgba(255, 251, 246, .79); font-size: 13px;
    }
    .action:hover:not(:disabled) { background: #fff9f0; border-color: rgba(91, 62, 42, .32); }
    a.action { color: inherit; text-decoration: none; }
    .action[aria-pressed="true"] { background: #f4ded5; border-color: #d6a49a; color: #783c32; }
    #stage {
      position: relative; isolation: isolate; overflow: hidden;
      min-height: 423px; height: calc(100vh - 181px); height: calc(100svh - 181px); max-height: 1060px;
      border: 1px solid rgba(111, 75, 46, .16); border-radius: 22px;
      background:
        radial-gradient(ellipse at 27% 14%, rgba(255, 253, 246, .87), rgba(251, 243, 231, .32) 43%, transparent 67%),
        radial-gradient(ellipse at 49% 100%, #f0e1cc 0%, transparent 47%),
        linear-gradient(144deg, #e8d9c4 5%, #d7c1a7 86%);
      box-shadow: 0 18px 60px -51px rgba(75, 42, 25, .55);
    }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #stage canvas:active { cursor: grabbing; }
    #stage canvas:focus-visible { outline-offset: -4px; }
    #status {
      margin: 0; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      max-width: min(86%, 420px); width: max-content; padding: 11px 15px; border: 1px solid var(--line);
      border-radius: 10px; background: #fbf4eb; color: var(--muted); font-size: 13px; text-align: center;
    }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px 15px; flex-wrap: wrap; margin-top: 11px; }
    .views { display: flex; align-items: center; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: #eee4d7; }
    .views button { padding: 0 13px; min-height: 35px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; white-space: nowrap; }
    .views button:hover:enabled { background: rgba(255, 251, 245, .59); }
    .views button[aria-pressed="true"] { background: #fff9f0; color: #7d4035; box-shadow: 0 1px 3px #6e442018; }
    .actions { display: flex; gap: 7px; }
    .hint { margin: 0 0 0 auto; color: var(--muted); text-align: right; font-size: 12px; }
    .touch { display: none; }
    @media (pointer: coarse) {
      .mouse { display: none; }
      .touch { display: inline; }
      .views button { min-height: 42px; }
    }
    @media (max-width: 700px) {
      body { padding: 18px clamp(11px, 3.8vw, 22px) 15px; }
      .masthead { margin-bottom: 15px; }
      h1 { display: grid; }
      h1 span { white-space: nowrap; }
      h1 small { font-size: 12px; }
      #stage { min-height: 335px; height: min(66svh, 134vw); border-radius: 16px; }
      .toolbar { justify-content: space-between; }
      .hint { width: 100%; text-align: left; margin: 2px 0 0; }
      .views button { padding: 0 9px; }
      .action { padding: 0 10px; }
    }
    @media (max-width: 362px) {
      .toolbar { gap: 6px; }
      .views button { padding: 0 7px; font-size: 12px; }
      .action { padding: 0 7px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <h1><span>碎花垂耳兔</span><small>3D 预览</small></h1>
      <a class="action" href="../../index.html">返回展厅</a>
    </header>
    <section id="stage" aria-label="模型预览">
      <p id="status" role="status" hidden>正在载入三维模型…</p>
      <noscript><p>请启用 JavaScript 查看模型。</p></noscript>
    </section>
    <div class="toolbar">
      <div class="views" role="group" aria-label="切换视角">
        <button type="button" data-angle="3" aria-pressed="true" disabled>正面</button>
        <button type="button" data-angle="42" aria-pressed="false" disabled>斜侧</button>
        <button type="button" data-angle="90" aria-pressed="false" disabled>侧面</button>
        <button type="button" data-angle="180" aria-pressed="false" disabled>背面</button>
        <button type="button" data-angle="13" data-material-view aria-pressed="false" disabled>材质近看</button>
      </div>
      <div class="actions" role="group" aria-label="预览操作">
        <button class="action" id="rotate" type="button" aria-pressed="false" disabled>自动旋转</button>
        <button class="action" id="reset" type="button" disabled>复位</button>
      </div>
      <p class="hint"><span class="mouse">拖动旋转 · 滚轮缩放</span><span class="touch">拖动旋转 · 双指缩放</span></p>
    </div>
  </main>
  __MODEL_DATA__
  <script>__BUNDLE_JS__</script>
</body>
</html>
