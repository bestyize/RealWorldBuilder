<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#384969">
  <title>潮汐书房 · 鲸鱼娘</title>
  <style>
    :root { color-scheme: light; font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; color: #303c58; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #75849d; }
    #world { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #world:active { cursor: grabbing; }
    :focus-visible { outline: 3px solid #bd7d62; outline-offset: 3px; }
    #world:focus-visible { outline-offset: -4px; }
    button { appearance: none; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: progress; opacity: .65; }
    .mast, .tools, .dock { position: fixed; z-index: 1; }
    .mast { top: max(20px,env(safe-area-inset-top)); left: max(24px,env(safe-area-inset-left)); padding: 10px 19px 12px; color: #faf5e9; background: #354969f5; border: 1px solid #d7c6ad; outline: 1px solid #415172; box-shadow: inset 0 0 0 3px #354969,inset 0 0 0 4px #d8c5b288,0 4px 14px #182b292b; pointer-events: none; }
    h1, h2 { font-family: "Songti SC","STSong","Noto Serif CJK SC",serif; }
    h1 { margin: 0; font-size: clamp(24px,2.45vw,34px); letter-spacing: .13em; font-weight: 650; line-height: 1.23; }
    .mast p { margin: 4px 0 0; font-size: 12px; color: #dcdef0; letter-spacing: .07em; }
    .tools { display: flex; align-items: center; gap: 9px; top: max(20px,env(safe-area-inset-top)); right: max(24px,env(safe-area-inset-right)); }
    .views, .credit-button, .dock, dialog { background: #fbf8f4f5; border: 1px solid #b6b1c1; box-shadow: 0 4px 16px #25304b2b; }
    .views { display: flex; padding: 3px; border-radius: 8px; }
    .views button, .credit-button { border-radius: 5px; padding: 0 13px; min-height: 38px; font-size: 13px; white-space: nowrap; color: #384660; }
    .views button { border: 0; background: transparent; }
    .views [aria-pressed="true"] { background: #4a6185; color: #fff9ed; }
    .views button:hover:not([aria-pressed="true"]), .credit-button:hover { background: #e5e5ef; }
    .credit-button { border-radius: 8px; min-height: 46px; }
    .dock { bottom: max(18px,env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 20px; padding: 8px 9px 8px 16px; border-radius: 12px; }
    .dock-text { min-width: 0; }
    #status { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.4; }
    .hint { margin: 3px 0 0; color: #62677a; font-size: 12px; line-height: 1.4; white-space: nowrap; }
    .actions { display: flex; gap: 6px; }
    .action { min-height: 42px; padding: 0 14px; border: 1px solid #44587d; border-radius: 7px; color: #fffaf3; background: #4b6288; font-weight: 600; font-size: 14px; white-space: nowrap; }
    .action:hover:enabled { background: #3a4b70; }
    #writing { color: #534f6b; background: #e6e2ed; border-color: #b6abc1; }
    #writing:hover:enabled { background: #d6d2e5; }
    dialog { max-width: min(420px,92vw); padding: 23px; border-radius: 12px; color: #34435c; }
    dialog::backdrop { background: #242e4ba6; }
    dialog h2 { margin: 0 0 12px; font-size: 26px; }
    dialog p { margin: 8px 0; line-height: 1.6; font-size: 14px; }
    dialog a { color: #415c85; text-underline-offset: 3px; }
    dialog form { margin: 16px 0 0; text-align: right; }
    noscript { position: fixed; inset: 40% 10% auto; text-align: center; background: #fffaee; padding: 12px; }
    @media (max-width: 640px) {
      .mast { left: max(11px,env(safe-area-inset-left)); top: max(12px,env(safe-area-inset-top)); padding: 8px 12px; }
      .mast p { font-size: 10px; }
      .tools { top: max(12px,env(safe-area-inset-top)); right: max(10px,env(safe-area-inset-right)); gap: 4px; }
      .views button, .credit-button { padding: 0 9px; min-height: 38px; }
      .credit-button { min-height: 46px; }
      .dock { width: max-content; max-width: calc(100% - 18px); bottom: max(10px,env(safe-area-inset-bottom)); gap: 9px; padding-left: 10px; }
      #status { font-size: 13px; } .hint { font-size: 10px; white-space: normal; }
      .action { min-height: 42px; padding: 0 9px; font-size: 13px; }
    }
    @media (max-height: 500px) {
      .mast { top: max(7px,env(safe-area-inset-top)); padding: 5px 12px; } .mast h1 { font-size: 20px; }
      .mast p,.hint { display: none; }
      .tools { top: max(7px,env(safe-area-inset-top)); }
      .dock { bottom: max(5px,env(safe-area-inset-bottom)); padding-block: 3px; }
    }

    #shelf { background: #ebe2d3; color: #554839; border-color: #c5b9a4; }
    #shelf:hover:enabled { background: #dfd2bf; }
    #keepsake { width: min(690px,94vw); max-width: none; max-height: 92dvh; overflow: auto; padding: 0; background: #505f75; border: 1px solid #2d3e55; border-radius: 5px 11px 11px 5px; box-shadow: 0 15px 55px #10203277; }
    .spread { margin: 7px 8px 10px; display: grid; grid-template-columns: .82fr 1.18fr; background: #f5eddb; color: #413e38; border-radius: 3px 7px 5px 3px; box-shadow: 0 3px 0 #b4a68f; }
    .book-leaf { padding: 29px 22px; background: linear-gradient(90deg,transparent 82%,#baaa8c40); }
    .book-leaf .leaf { margin: 0 0 24px; letter-spacing: .15em; font-size: 12px; color: #79674e; }
    .book-leaf h2 { line-height: 1.35; }
    .book-leaf .find-line { line-height: 1.85; }
    .found-object { padding: 28px 21px 16px; background: linear-gradient(90deg,#84704d36,transparent 10%); }
    .slip { width: 100%; display: block; padding: 0; background: transparent; border: 0; color: #47433b; }
    .slip-paper { position: relative; display: grid; align-items: center; aspect-ratio: 360/198; transform: rotate(-2deg); background: #ede2c6; box-shadow: 0 2px 5px #4d422d47; }
    .slip[data-item="0"] .slip-paper { mask-image: radial-gradient(circle at 0 86%,transparent 0 8px,#000 9px); }
    .slip[data-item="1"] .slip-paper { background: #faf2d9; }
    .slip[data-item="2"] .slip-paper { background: linear-gradient(90deg,transparent 49.5%,#c9bba766 50%,#fff8e7 50.6%,transparent 51%),linear-gradient(0deg,transparent 49%,#c9bba74d 50%,transparent 51%),repeating-linear-gradient(#f7f1df 0 17px,#cbd5d2 18px); }
    .slip canvas { width: 100%; height: auto; }
    .slip[data-back="true"] canvas { visibility: hidden; }
    .handwritten { position: absolute; inset: 0; align-content: center; padding: 12px 16px; text-align: left; font-family: "Kaiti SC","STKaiti",serif; }
    .handwritten span { display: block; line-height: 1.55; font-size: clamp(13px,2.6vw,17px); }
    .handwritten cite { display: block; margin-top: 7px; text-align: right; font-size: 12px; }
    .slip-label { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin: 16px 0 0; }
    .item-name { font-family: "Songti SC",serif; font-weight: 650; }
    .flip-caption { color: #50627a; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 540px) {
      .dock { flex-wrap: wrap; justify-content: center; }
      .dock-text { flex-basis: 100%; text-align: center; }
      .dock .hint { display: none; }
      .spread { display: block; }
      .book-leaf { padding: 18px 20px 3px; background: none; }
      .book-leaf .leaf { margin-bottom: 6px; }
      .found-object { padding: 10px 20px 16px; background: none; }
    }
  </style>
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="鲸鱼娘的海边书房。点地板或用方向键散步，R 在窗边读书，E 去书桌写信，B 去书架抽书，V 切换镜头。"></canvas>
  <header class="mast"><h1>潮汐书房</h1><p>鲸鱼娘的海湾夜读</p></header>
  <div class="tools">
    <div class="views" role="group" aria-label="镜头"><button type="button" data-camera="wide" aria-pressed="true">全景</button><button type="button" data-camera="follow" aria-pressed="false">跟随</button></div>
    <button type="button" id="credits" class="credit-button">署名</button>
  </div>
  <div class="dock">
    <div class="dock-text"><p id="status" role="status">正在打开书房…</p><p class="hint">点地板散步，拖动画面环顾。</p></div>
    <div class="actions"><button type="button" id="reading" class="action" disabled>窗边读书</button><button type="button" id="writing" class="action" disabled>书桌写信</button><button type="button" id="shelf" class="action" disabled>书架抽书</button></div>
  </div>
  <dialog id="keepsake" aria-labelledby="book-title">
    <div class="spread">
      <section class="book-leaf"><p class="leaf"></p><h2 id="book-title"></h2><p class="find-line"></p></section>
      <section class="found-object">
        <button type="button" class="slip" aria-pressed="false">
          <span class="slip-paper"><canvas aria-hidden="true"></canvas><span class="handwritten" hidden><span></span><cite></cite></span></span>
          <span class="slip-label"><span class="item-name"></span><span class="flip-caption"></span></span>
        </button>
        <form method="dialog"><button class="action">把书放回去</button></form>
      </section>
    </div>
  </dialog>
  <dialog id="about" aria-labelledby="credit-title">
    <h2 id="credit-title">作品署名</h2>
    <p>角色原型「溟月」由上善无形创作，DeepSeek 女仆鲸鱼娘由 ZipZipPipe 设计。Q 版模型、服装和动画来自 PekolandBBQ 的 v1.0.2 女仆版。动作及部分外观参考 merzlin 的 shenshen 桌宠及 PC2005-cloud 的 dsh-pet。</p>
    <p>本页内嵌原版模型，播放时沿用原作眨眼节奏，另行绘制眼睑。角色资产及这项表情改编遵循署名、非商业性使用、相同方式共享 4.0 国际许可。</p>
    <p><a href="https://github.com/PekolandBBQ/Deepseek-Dafeiyu-Chibi-3D-Model/releases/tag/v1.0.2" target="_blank" rel="noreferrer">模型发布页</a> · <a href="https://github.com/PekolandBBQ/Deepseek-Dafeiyu-Chibi-3D-Model/blob/v1.0.2/THIRD_PARTY_NOTICES.md" target="_blank" rel="noreferrer">原始素材说明</a> · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans" target="_blank" rel="noreferrer">许可全文与说明</a></p>
    <form method="dialog"><button class="action">返回书房</button></form>
  </dialog>
  <noscript>请在浏览器中启用 JavaScript 以进入书房。</noscript>
  __MODEL_DATA__
  <script>__BUNDLE_JS__</script>
</body>
</html>
